<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Souls — Echoes</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="echoes">

<header id="site-header">
  <div class="container inner">
    <a href="../index.html" class="brand">✦ Shared Souls</a>
    <nav>
      <a href="../index.html">Overview</a>
      <a href="characters.html">Characters</a>
      <a href="arcs.html">Arc Log</a>
      <a href="constellation.html">Constellation</a>
      <a href="echoes.html" class="active">Echoes</a>
    </nav>
  </div>
</header>

<main class="container page-wrap">
  <div class="page-header">
    <p class="eyebrow">Key Dialogue · 20 Quotes · 97 Chapters</p>
    <h1>Echoes</h1>
    <p>Defining lines across the full story. Filter by speaker.</p>
  </div>

  <div class="filter-bar" id="echo-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="momo">Momo</button>
    <button data-filter="shinobu">Shinobu</button>
    <button data-filter="natasha">Natasha</button>
    <button data-filter="ekaterina">Ekaterina</button>
    <button data-filter="katsuki">Bakugou</button>
    <button data-filter="hanta">Sero</button>
    <button data-filter="kurohana">Kurohana</button>
    <button data-filter="allMight">All Might</button>
    <button data-filter="narrator">Narrator</button>
  </div>

  <div class="dialogue-list" id="dialogue-list"></div>
</main>

<footer>
  <div class="container inner">
    <span>Shared Souls · Echoes</span>
    <span><a href="../index.html" style="color:var(--text-faint)">← Back to Overview</a></span>
  </div>
</footer>

<script type="module">
import { DIALOGUE } from '../data/characters.js';

const LABELS = { momo:'Yaoyorozu Momo', shinobu:'Kochou Shinobu', natasha:'Natasha Romanov', ekaterina:'Yaoyorozu Ekaterina', katsuki:'Bakugou Katsuki', hanta:'Sero Hanta', kurohana:'Kurohana', allMight:'All Might', narrator:'— Narrator —' };
const COLORS  = { momo:'#805AD5', shinobu:'#9F7AEA', natasha:'#F56565', ekaterina:'#FEB2B2', katsuki:'#ED8936', hanta:'#68D391', kurohana:'#4A5568', allMight:'#F6AD55', narrator:'#A0AEC0' };

function build(filter) {
  const list = document.getElementById('dialogue-list');
  list.innerHTML = '';
  const entries = filter === 'all' ? DIALOGUE : DIALOGUE.filter(d => d.speaker === filter);
  if (!entries.length) { list.innerHTML = '<p style="color:var(--text-faint);font-size:0.85rem;padding:1rem 0">No entries for this filter.</p>'; return; }
  entries.forEach(line => {
    const col = COLORS[line.speaker] || '#A0AEC0';
    const div = document.createElement('div');
    div.className = 'dialogue-entry';
    div.style.setProperty('--speaker-color', col);
    div.innerHTML = `
      <div class="d-header">
        <span class="d-speaker" style="color:${col}">${LABELS[line.speaker] || line.speaker}</span>
        <span class="d-context">${line.context}</span>
      </div>
      <div class="d-text">"${line.text}"</div>`;
    list.appendChild(div);
  });
}

document.getElementById('echo-filters').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#echo-filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    build(btn.dataset.filter);
  });
});
build('all');
</script>
</body>
</html>
